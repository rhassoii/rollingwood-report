# config/disclosures.yml — operator disclosures
#
# Source of truth for the current operator's civic applications,
# appointments, and affiliations that touch Rollingwood municipal
# matters. Intended to be rendered into each issue of the Rollingwood
# Report (rendering is not yet implemented — see methodology.md).
#
# Provenance: The Rollingwood Report was created by Jeff Marx and handed
# off to Ronald Hasso in October 2026.
#
# Update cadence:
#   - Whenever the operator's civic status changes (new application,
#     appointment, term end, resignation).
#   - Touch `last_reviewed` on every update AND on a quarterly audit
#     even when nothing else changed.
#
# Fail-loud on malformed input (pipeline behavior contract):
#   - File missing, unreadable, or YAML-unparseable: pipeline aborts.
#   - methodology.md anchor pair not findable at render time:
#     pipeline aborts.
#   - Silent omission of the disclosure block is the worst failure
#     mode; failed-send forces operator attention.
#
# See methodology.md ("Operator and disclosures") for the
# standing-disclosure paragraph.

last_reviewed: "2026-10-23"

operator: "Ronald Hasso"

statement: "Ronald Hasso is a former member of the Rollingwood Utility Commission and the Comprehensive Plan Strike Force (inactive)."
disclosures:
  - role: "Former member"
    body: "Rollingwood Utility Commission"
    body_short: "Utility Commission"
    status: former
  - role: "Former member"
    body: "Comprehensive Plan Strike Force (inactive)"
    body_short: "CPSF"
    status: former
